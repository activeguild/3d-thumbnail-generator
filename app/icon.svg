<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <!-- 3D Cube - top face -->
  <polygon points="256,120 380,188 256,256 132,188" fill="#818cf8" opacity="0.35"/>
  <!-- 3D Cube - left face -->
  <polygon points="132,188 256,256 256,380 132,312" fill="#818cf8" opacity="0.2"/>
  <!-- 3D Cube - right face -->
  <polygon points="256,256 380,188 380,312 256,380" fill="#a78bfa" opacity="0.25"/>
  <!-- Edge highlights -->
  <line x1="256" y1="120" x2="380" y2="188" stroke="#818cf8" stroke-width="2.5" opacity="0.6"/>
  <line x1="256" y1="120" x2="132" y2="188" stroke="#818cf8" stroke-width="2.5" opacity="0.6"/>
  <line x1="256" y1="120" x2="256" y2="256" stroke="#818cf8" stroke-width="2" opacity="0.4"/>
  <line x1="132" y1="188" x2="132" y2="312" stroke="#818cf8" stroke-width="2" opacity="0.3"/>
  <line x1="380" y1="188" x2="380" y2="312" stroke="#a78bfa" stroke-width="2" opacity="0.3"/>
  <line x1="132" y1="312" x2="256" y2="380" stroke="#818cf8" stroke-width="2" opacity="0.3"/>
  <line x1="256" y1="380" x2="380" y2="312" stroke="#a78bfa" stroke-width="2" opacity="0.3"/>
  <line x1="132" y1="188" x2="256" y2="256" stroke="#818cf8" stroke-width="2" opacity="0.3"/>
  <line x1="256" y1="256" x2="380" y2="188" stroke="#a78bfa" stroke-width="2" opacity="0.3"/>
  <line x1="256" y1="256" x2="256" y2="380" stroke="#a78bfa" stroke-width="1.5" opacity="0.2"/>
  <!-- Camera lens circle (bottom right) -->
  <circle cx="358" cy="358" r="52" fill="none" stroke="url(#accent)" stroke-width="7" opacity="0.8"/>
  <circle cx="358" cy="358" r="28" fill="none" stroke="#a78bfa" stroke-width="4" opacity="0.5"/>
  <circle cx="358" cy="358" r="10" fill="#818cf8" opacity="0.7"/>
  <!-- Shutter flash -->
  <line x1="340" y1="310" x2="328" y2="290" stroke="#a78bfa" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="366" y1="306" x2="378" y2="286" stroke="#a78bfa" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
</svg>
