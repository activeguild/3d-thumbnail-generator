<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="face-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="face-dark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 3D Cube - top face -->
  <polygon points="256,120 380,188 256,256 132,188" fill="#e0e7ff" opacity="0.95"/>
  <!-- 3D Cube - left face -->
  <polygon points="132,188 256,256 256,380 132,312" fill="#a5b4fc"/>
  <!-- 3D Cube - right face -->
  <polygon points="256,256 380,188 380,312 256,380" fill="#818cf8"/>
  <!-- Subtle edge highlights -->
  <line x1="256" y1="120" x2="256" y2="256" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="256" y1="256" x2="256" y2="380" stroke="white" stroke-width="1.5" opacity="0.15"/>
  <line x1="132" y1="188" x2="256" y2="256" stroke="white" stroke-width="1.5" opacity="0.2"/>
  <line x1="256" y1="256" x2="380" y2="188" stroke="white" stroke-width="1.5" opacity="0.2"/>
  <!-- Camera lens circle (bottom right) -->
  <circle cx="358" cy="358" r="52" fill="none" stroke="white" stroke-width="8" opacity="0.9"/>
  <circle cx="358" cy="358" r="28" fill="none" stroke="white" stroke-width="5" opacity="0.7"/>
  <circle cx="358" cy="358" r="10" fill="white" opacity="0.8"/>
  <!-- Shutter flash -->
  <line x1="340" y1="310" x2="328" y2="290" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="366" y1="306" x2="378" y2="286" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
